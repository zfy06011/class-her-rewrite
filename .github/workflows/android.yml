name: Android probe

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record actual checked-out source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Existing parser and school request checks
        run: |
          python -m pip install lxml==6.0.2
          python verify/parse_timetable.py --self-test
          node --check prototype/app.js
          node --check app/src/main/assets/sdwu-fetch.js
          node verify/sdwu_fetch_test.cjs
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install cloud Android packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests, lint and debug APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Write APK source provenance
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          config = pathlib.Path('app/build.gradle.kts').read_text()
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          provenance = {
              'commit': os.environ['BUILD_SHA'],
              'run': os.environ['BUILD_RUN'],
              'variant': 'debug',
              'versionName': re.search(r'versionName = "([^"]+)"', config)[1],
              'versionCode': int(re.search(r'versionCode = (\d+)', config)[1]),
              'applicationId': re.search(r'applicationId = "([^"]+)"', config)[1],
              'apkSha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'deviceValidated': False,
          }
          pathlib.Path('app/build/outputs/provenance.json').write_text(json.dumps(provenance, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Probe APK built from `' + provenance['commit'] + '`. Device validation pending.\n')
          PY
      - name: Upload probe APK and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: classher-probe-${{ steps.source.outputs.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-checks-${{ steps.source.outputs.sha }}
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
